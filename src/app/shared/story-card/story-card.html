<a class="story-card" [routerLink]="['/stories', story().slug]">
  @if (story().heroImage) {
  <img
    class="story-card-image"
    [src]="story().heroImage"
    [alt]="'Image of ' + story().personName"
    loading="lazy"
    />
  } @else {
  <span class="story-card-image story-card-image--empty" aria-hidden="true"></span>
  }
  <span class="story-card-body">
    <span class="story-card-num">Story {{ pad(story().id) }}</span>
    <span class="story-card-name">{{ story().personName }}</span>
    <span class="story-card-loc">{{ story().country }} · {{ story().storyDate ?? story().birthYear }}</span>
    <span class="story-card-desc">{{ story().shortDescription }}</span>
  </span>
</a>
